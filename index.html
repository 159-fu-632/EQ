<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Music EQ</title><style>
body{margin:0;background:#101217;color:#eee;font-family:system-ui;padding:20px}main{max-width:1100px;margin:auto}.card{background:#191c23;border:1px solid #303541;border-radius:14px;padding:16px;margin:12px 0}button,label{background:#272c36;color:#eee;border:1px solid #454b57;border-radius:8px;padding:9px 12px;cursor:pointer}input[type=file]{display:none}audio{width:100%;margin-top:12px}#eq{display:grid;grid-template-columns:repeat(16,1fr);gap:7px;align-items:end}.band{text-align:center;font-size:11px}.band input{writing-mode:vertical-lr;direction:rtl;height:190px;width:25px}.muted{color:#9da5b5;font-size:13px}#list{max-height:300px;overflow:auto}.track{padding:8px;border-bottom:1px solid #2a2e37;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.active{background:#29303c;border-radius:6px}input[type=text]{width:100%;box-sizing:border-box;background:#11141a;color:white;border:1px solid #414752;border-radius:8px;padding:10px}iframe{width:100%;aspect-ratio:16/9;border:0;margin-top:10px}@media(max-width:800px){#eq{grid-template-columns:repeat(8,1fr)}}</style></head><body><main>
<h1>Local Music EQ</h1><div class="muted">本地音乐 / 文件夹播放 / 16段均衡器 / 系统默认输出</div>
<section class="card"><h2>音乐库</h2><label>选择文件<input id="files" type="file" multiple accept="audio/*"></label> <label>选择文件夹<input id="folder" type="file" multiple webkitdirectory accept="audio/*"></label><div id="list"></div></section>
<section class="card"><h2 id="now">没有选择歌曲</h2><audio id="audio" controls></audio><div><button id="prev">上一首</button><button id="next">下一首</button><button id="flat">EQ归零</button> 音量 <input id="vol" type="range" min="0" max="1.5" step=".01" value="1"></div></section>
<section class="card"><h2>16段 EQ</h2><div class="muted">20Hz–20kHz，Peaking，±12dB；仅处理本地音频。</div><div id="eq"></div></section>
<section class="card"><h2>YouTube</h2><input id="url" placeholder="粘贴 YouTube 分享链接"><button id="yt">播放</button><button id="close">关闭</button><p class="muted">YouTube 使用官方嵌入播放器。纯 GitHub Pages 无法把 YouTube 跨域音频流接入 Web Audio API，所以 YouTube 可以播放，但不能经过本页16段 EQ；本地文件可以完整 EQ。</p><div id="ytbox"></div></section>
</main><script>
const F=[20,31.5,50,80,125,200,315,500,800,1250,2000,3150,5000,8000,12500,20000],$=x=>document.getElementById(x);let ctx,src,master,filters=[],files=[],i=-1,url;
F.forEach((f,n)=>{let d=document.createElement("div");d.className="band";d.innerHTML='<input id="e'+n+'" type="range" min="-12" max="12" step=".1" value="0"><div>'+(f>=1000?f/1000+"k":f)+'Hz</div><div id="g'+n+'">0dB</div>';$("eq").append(d)});
async function init(){if(ctx){if(ctx.state==="suspended")await ctx.resume();return}ctx=new AudioContext();src=ctx.createMediaElementSource($("audio"));let x=src;F.forEach((f,n)=>{let b=ctx.createBiquadFilter();b.type="peaking";b.frequency.value=f;b.Q.value=1.15;b.gain.value=0;filters[n]=b;x.connect(b);x=b});master=ctx.createGain();x.connect(master);master.connect(ctx.destination)}
F.forEach((_,n)=>$("e"+n).oninput=async e=>{await init();let v=+e.target.value;filters[n].gain.value=v;$("g"+n).textContent=(v>0?"+":"")+v.toFixed(1)+"dB"});
async function play(n){if(!files[n])return;await init();i=n;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(files[n]);$("audio").src=url;$("now").textContent=files[n].name;$("list").querySelectorAll(".track").forEach((x,k)=>x.classList.toggle("active",k===i));await $("audio").play().catch(()=>{})}
function add(a){files.push(...[...a].filter(f=>f.type.startsWith("audio/")||/\.(mp3|m4a|aac|wav|flac|ogg|opus|webm)$/i.test(f.name)));$("list").innerHTML=files.map((f,n)=>'<div class="track" title="'+f.name.replace(/"/g,"&quot;")+'">'+f.name+'</div>').join("");[...$("list").children].forEach((x,n)=>x.onclick=()=>play(n));if(i<0&&files.length)play(0)}
$("files").onchange=e=>add(e.target.files);$("folder").onchange=e=>add(e.target.files);$("audio").onended=()=>files.length&&play((i+1)%files.length);$("prev").onclick=()=>files.length&&play((i-1+files.length)%files.length);$("next").onclick=()=>files.length&&play((i+1)%files.length);$("vol").oninput=async e=>{await init();master.gain.value=+e.target.value};$("flat").onclick=()=>F.forEach((_,n)=>{$("e"+n).value=0;$("g"+n).textContent="0dB";if(filters[n])filters[n].gain.value=0});
function yid(s){try{let u=new URL(s.trim());if(u.hostname==="youtu.be")return u.pathname.slice(1).split("/")[0];if(u.hostname.includes("youtube.com"))return u.searchParams.get("v")||u.pathname.split("/")[2]}catch(e){}return null}
$("yt").onclick=()=>{let id=yid($("url").value);if(!id)return alert("无法识别 YouTube 链接");$("ytbox").innerHTML='<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>'};$("close").onclick=()=>$("ytbox").innerHTML="";
</script></body></html>
